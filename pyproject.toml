[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-optimizer"
version = "0.3.0"
description = "Harness-independent agent optimization experiment workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic-settings>=2,<3", "typer>=0.27,<0.28", "rich>=14,<15", "textual>=6,<8"]

[project.scripts]
agent-opt = "agent_optimizer.entrypoint:main"

[project.optional-dependencies]
dev = ["build==1.2.2.post1", "ruff==0.11.13"]
native = ["PyYAML==6.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/agent-optimizer/examples/ace-rtl" = [
  "examples/ace-rtl/native_adapter.py", "examples/ace-rtl/native_worker.py",
  "examples/ace-rtl/native_bridge.py", "examples/ace-rtl/native_cvdp.py",
  "examples/ace-rtl/native_evaluator.py", "examples/ace-rtl/native_prepare.py",
  "examples/ace-rtl/native_selection.py", "examples/ace-rtl/native_artifacts.py",
  "examples/ace-rtl/native_cleanup.py", "examples/ace-rtl/evaluator.py",
  "examples/ace-rtl/source-native.toml", "examples/ace-rtl/harness-native.toml",
]
"share/agent-optimizer/examples/ace-rtl/native" = [
  "examples/ace-rtl/native/guidance.md", "examples/ace-rtl/native/orchestration.py",
]
"share/agent-optimizer/examples/ace-rtl/environment" = [
  "examples/ace-rtl/environment/network_driver.py",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# MVP: syntax errors and definite name/control-flow errors, without style churn.
select = ["E9", "F63", "F7", "F82"]
