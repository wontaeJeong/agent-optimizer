[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-optimizer"
version = "0.3.0"
description = "Harness-independent agent optimization experiment workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["build==1.2.2.post1", "ruff==0.11.13"]

[tool.setuptools]
script-files = ["scripts/agent-opt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# MVP: syntax errors and definite name/control-flow errors, without style churn.
select = ["E9", "F63", "F7", "F82"]
