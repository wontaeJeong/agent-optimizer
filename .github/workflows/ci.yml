name: core-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-checks
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated development environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Unit and contract tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Minimal demo
        run: .venv/bin/python -m agent_optimizer run examples/minimal/experiment.toml
      - name: Build sdist and wheel
        run: .venv/bin/python -m build
      - name: Verify installed wheel outside source tree
        run: |
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install dist/*.whl
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" -I -m agent_optimizer --help
          "$smoke_dir/venv/bin/agent-opt" --help
