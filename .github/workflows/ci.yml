name: core-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      official_cvdp:
        description: Build official Docker images and run key-free CVDP integration
        type: boolean
        default: false
      verilog_eval_full:
        description: Verify both pinned Verilog-Eval datasets on Ubuntu amd64
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-checks
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 의존성 캐시 경로 준비
        run: |
          echo "UV_CACHE_DIR=$RUNNER_TEMP/agent-opt-cache/uv" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/agent-opt-cache/pip" >> "$GITHUB_ENV"
      - name: 고정 Python 의존성 캐시
        if: github.server_url == 'https://github.com'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/agent-opt-cache
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python }}-uv-0.10.7-${{ hashFiles('uv.lock', 'pyproject.toml') }}
      - name: Install isolated development environment
        run: |
          python -m venv "$RUNNER_TEMP/agent-opt-uv"
          "$RUNNER_TEMP/agent-opt-uv/bin/python" -m pip install uv==0.10.7
          "$RUNNER_TEMP/agent-opt-uv/bin/uv" sync --frozen --python '${{ matrix.python }}' --extra dev
      - name: Install native Ubuntu simulators
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys iverilog
      - name: Require actual simulator coverage (preinstall on self-hosted runners)
        run: |
          yosys -V
          iverilog -V
          vvp -V
      - name: Developer command help
        run: make help
      - name: Lint
        run: make lint
      - name: Unit and contract tests
        run: .venv/bin/python scripts/run_tests.py --jobs 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact endpoint hook contract
        run: node --test tests/endpoint-plugin.test.mjs
      - name: Minimal demo
        run: make demo
      - name: Build sdist and wheel
        run: '"$RUNNER_TEMP/agent-opt-uv/bin/uv" build --python .venv/bin/python'
      - name: 격리된 wheel CLI의 목록·사용자 실험 기능 확인
        run: |
          wheel=$(.venv/bin/python scripts/select_wheel.py dist)
          python tests/test_installed_cli.py "$wheel"

  official-cvdp:
    name: ACE/CVDP 실행환경·공식 평가 (수동, 모델 미사용)
    if: github.event_name == 'workflow_dispatch' && inputs.official_cvdp
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 캐시 경로 준비
        run: |
          echo "UV_CACHE_DIR=$RUNNER_TEMP/agent-opt-cache/uv" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/agent-opt-cache/pip" >> "$GITHUB_ENV"
      - name: 공식 통합의 Python 의존성·검증 대상 데이터 캐시
        if: github.server_url == 'https://github.com'
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/agent-opt-cache
            external/cvdp-data
          key: official-cvdp-${{ runner.os }}-${{ runner.arch }}-uv-0.10.7-${{ hashFiles('uv.lock', 'examples/ace-rtl/environment/setup.py', 'examples/ace-rtl/environment/requirements-cvdp-py312.txt') }}
      - name: Bootstrap pinned uv
        run: |
          python -m venv "$RUNNER_TEMP/agent-opt-uv"
          "$RUNNER_TEMP/agent-opt-uv/bin/python" -m pip install uv==0.10.7
          echo "$RUNNER_TEMP/agent-opt-uv/bin" >> "$GITHUB_PATH"
      - name: Prepare native Docker environment
        run: make setup
      - name: Diagnose prepared environment
        run: make doctor
      - name: Verify offline reuse
        run: make setup ARGS="--offline"
      - name: Real tools, host-Docker and official positive/negative evaluation
        run: make smoke
      - name: 모델 키 없는 ACE CLI 실행의 명시적 차단 확인
        run: |
          .venv/bin/python - <<'PY'
          import json
          import os
          import subprocess

          env = {key: value for key, value in os.environ.items() if key not in {
               "AGENT_OPT_MODEL_API_KEY", "AGENT_OPT_MODEL_BASE_URL"}}
          result = subprocess.run([".venv/bin/agent-opt", "run", "examples/ace-rtl/experiment.toml"],
                                  env=env, capture_output=True, text=True, timeout=60, check=False)
          assert result.returncode == 2, (result.returncode, result.stdout, result.stderr)
          status = json.loads(result.stdout.splitlines()[-1])
          assert status["status"] == "blocked" and status["stage"] == "live", status
          PY
      - name: Check actual image defaults and explicit provider configuration (no inference)
        run: |
          AGENT_OPT_TEST_DOCKER_IMAGE=$(python3 -c 'import json; print(json.load(open("external/environment-lock.json"))["images"]["agent"]["id"])')
          DOCKER_DEFAULT_PLATFORM=$(python3 -c 'import json; print(json.load(open("external/environment-lock.json"))["platform"])')
          export AGENT_OPT_TEST_DOCKER_IMAGE DOCKER_DEFAULT_PLATFORM
          PYTHONPATH=src:tests .venv/bin/python -m unittest test_adapters.DockerEnvironmentTests -v
          docker run --rm --network none \
            --mount "type=bind,source=$PWD/tests/opencode_endpoint_fixture.py,target=/fixture.py,readonly" \
            "$AGENT_OPT_TEST_DOCKER_IMAGE" python3 /fixture.py
      - name: Retain official integration evidence
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: official-cvdp-${{ github.run_id }}
          retention-days: 7
          path: |
            external/environment-lock.json
            external/setup-logs/
            runs/dev-smoke-*/
            runs/docker-env-regression-*/

  verilog-eval-full:
    name: Verilog-Eval full (${{ matrix.dataset }})
    if: github.event_name == 'workflow_dispatch' && inputs.verilog_eval_full
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        dataset: [verilog-spec, verilog-completion]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 캐시 경로 준비
        run: |
          echo "UV_CACHE_DIR=$RUNNER_TEMP/agent-opt-cache/uv" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/agent-opt-cache/pip" >> "$GITHUB_ENV"
      - name: 전체 평가의 Python 의존성 캐시
        if: github.server_url == 'https://github.com'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/agent-opt-cache
          key: verilog-eval-${{ runner.os }}-${{ runner.arch }}-${{ matrix.dataset }}-uv-0.10.7-${{ hashFiles('uv.lock') }}
      - name: 고정 uv 준비
        run: |
          python -m venv "$RUNNER_TEMP/agent-opt-uv"
          "$RUNNER_TEMP/agent-opt-uv/bin/python" -m pip install uv==0.10.7
          echo "$RUNNER_TEMP/agent-opt-uv/bin" >> "$GITHUB_PATH"
      - name: 프로젝트 의존성 준비
        run: make setup-core
      - name: 선택 모드의 전체 평가
        run: |
          uname -m
          docker version --format '{{.Server.Os}}/{{.Server.Arch}}'
          .venv/bin/python examples/benchmarks/verify_verilog_eval_full.py --dataset '${{ matrix.dataset }}' --require-ubuntu-amd64
      - name: 정제된 결과만 보존
        if: always() && github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v4
        with:
          name: verilog-eval-full-${{ matrix.dataset }}-${{ github.run_id }}
          path: runs/verilog-eval-full/${{ matrix.dataset }}/summary.json
          if-no-files-found: error
