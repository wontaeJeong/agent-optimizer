name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 의존성 캐시 경로 준비
        run: |
          echo "UV_CACHE_DIR=$RUNNER_TEMP/agent-opt-cache/uv" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/agent-opt-cache/pip" >> "$GITHUB_ENV"
      - name: 릴리즈 빌드 의존성 캐시
        if: github.server_url == 'https://github.com'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/agent-opt-cache
          key: release-${{ runner.os }}-${{ runner.arch }}-3.11-uv-0.10.7-${{ hashFiles('uv.lock', 'pyproject.toml') }}
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          tag = os.environ['RELEASE_TAG']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag!r} must match package version v{version}')
          PY
      - name: Build release packages
        run: |
          python -m venv "$RUNNER_TEMP/agent-opt-uv"
          "$RUNNER_TEMP/agent-opt-uv/bin/python" -m pip install uv==0.10.7
          "$RUNNER_TEMP/agent-opt-uv/bin/uv" build --python python
      - name: Generate release checksums
        working-directory: dist
        run: sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - name: Publish GitHub or GHES release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export GH_HOST="${SERVER_URL#https://}"
          gh --version
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --draft --title "$RELEASE_TAG" \
            --notes "Validated demo package. See CONTRIBUTING.md for installation and verification."
          gh release edit "$RELEASE_TAG" --draft=false
