schema_version = 1
name = "team-harness-template"
project_root = "../.."
agents = ["experiments/harness-template/agent.toml"]
harnesses = ["experiments/harness-template/harness.toml"]
benchmark = "examples/minimal/tasks.json"
evaluator = "text_fixture"
seed = 42
final_test = true

[plugins.harnesses]
team_harness = "experiments/harness-template/adapter.py:Harness"
[plugins.evaluators]
text_fixture = "examples/minimal/evaluator.py:TextFixtureEvaluator"

[budget]
max_trials = 10
max_wall_time_seconds = 120
trial_timeout_seconds = 10

[objective]
mode = "lexicographic"
[[objective.metrics]]
name = "solve_rate"
source = "passed"
direction = "maximize"
