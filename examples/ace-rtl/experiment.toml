schema_version = 1
name = "ace-rtl-opencode-cvdp-demo"
project_root = "../.."
agents = ["examples/ace-rtl/source.toml"]
harnesses = ["examples/ace-rtl/harness.toml"]
benchmark = "datasets/ace-demo/tasks.json"
evaluator = "cvdp"
final_test = false
final_stages = ["baseline", "brief-guidance"]
[plugins.harnesses]
ace_opencode = "examples/ace-rtl/adapter.py:ACEOpenCode"
[plugins.evaluators]
cvdp = "examples/ace-rtl/evaluator.py:CVDPEvaluator"
[budget]
max_trials = 4
max_wall_time_seconds = 2400
trial_timeout_seconds = 600
[objective]
mode = "lexicographic"
[[objective.metrics]]
name = "solve_rate"
source = "passed"
direction = "maximize"
[[objective.metrics]]
name = "seconds"
source = "task_wall_time_seconds"
direction = "minimize"
[[stages]]
id = "brief-guidance"
optimizer = "file_variants"
inputs = ["baseline"]
[stages.config]
include_seeds = true
[[stages.config.variants]]
name = "short-role-guidance"
[stages.config.variants.files]
"skills/ace-rtl/references/role-guidance.md" = "Generator: implement only public requirements. Reflector: identify one concrete mismatch from available evidence. Coordinator: choose the smallest justified next change; stop when public checks are exhausted. Keep role summaries concise and never infer a private evaluator pass."
